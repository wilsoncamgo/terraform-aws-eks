apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-wilsonanca
  namespace: default
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: prod-alpha-07
    alb.ingress.kubernetes.io/success-codes: 200-399
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: '80'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-1-2021-06
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}, {"HTTP":80}]'
    alb.ingress.kubernetes.io/target-group-attributes: deregistration_delay.timeout_seconds=30
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:975049889333:certificate/fb7e5149-9471-480a-a7cb-a331b3b06006
spec:
  ingressClassName: alb
  rules:
  - host: health.wilsonanca.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: uptime-kuma
            port:
              number: 80
  - host: ntfy.wilsonanca.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ntfy-svc
            port:
              number: 80
  - host: php.wilsonanca.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: php-prestashop-durocolor
            port:
              number: 80
  - host: wphp.wilsonanca.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wp-php-admn
            port:
              number: 80
  - host: pgadmin.wilsonanca.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pgadmin
            port:
              number: 80
  - host: grafana.wilsonanca.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 80
